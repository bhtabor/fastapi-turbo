<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fastapi-turbo minimal demo</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8/dist/turbo.es2017-esm.js"
    ></script>
  </head>
  <body>
    <h1>Todos</h1>

    <form action="/todos" method="post">
      <input name="text" required />
      <button type="submit">Add</button>
    </form>

    <ul id="todos">
      {% for todo in todos %}{% include "_todo_row.html" %}{% endfor %}
    </ul>
  </body>
</html>
